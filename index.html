
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Quick Question ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card {
    background: white;
    width: 100%;
    max-width: 400px;
    padding: 40px 25px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    animation: pop 0.5s ease;
}

@keyframes pop {
    from {
        transform: scale(0.7);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

.emoji {
    font-size: 65px;
    margin-bottom: 20px;
}

h1 {
    color: #ff4f81;
    font-size: 27px;
    margin-bottom: 15px;
}

p {
    color: #777;
    margin-bottom: 30px;
    font-size: 15px;
}

.btn-group {
    display: flex;
    justify-content: center;
    gap: 15px;
    position: relative;
}

button {
    border: none;
    padding: 13px 28px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

#yes-btn {
    background: #ff4f81;
    color: white;
}

#yes-btn:hover {
    background: #e9366a;
    transform: scale(1.1);
}

#no-btn {
    background: #eeeeee;
    color: #555;
}

.reset-btn {
    background: #ff4f81;
    color: white;
}

.hidden {
    display: none;
}

#success-box {
    animation: pop 0.5s ease;
}

.heart {
    position: fixed;
    bottom: -30px;
    font-size: 25px;
    animation: float 4s linear forwards;
    pointer-events: none;
}

@keyframes float {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<!-- Question Card -->
<div class="card" id="question-box">

    <div class="emoji" id="emoji">🥺</div>

    <h1 id="question">Who misses whom more, Shokak or Oishi?</h1>

    <p id="subtext">
        Be honest...Oishi don't lie  (Try clicking 😉)
    </p>

    <div class="btn-group">
        <button id="yes-btn">Shokal Misses Oishi More❤️</button>
        <button id="no-btn">Oishi misses Shokal More💔</button>
    </div>

</div>

<!-- Success Card -->
<div class="card hidden" id="success-box">

    <div class="emoji">🥰🎉</div>

    <h1>I knew it!</h1>

    <p>I Miss you Forever and always. ❤️</p>

    <button id="reset-btn" class="reset-btn">
        Ask Again 🔁
    </button>

</div>

<script>

const yesBtn = document.getElementById("yes-btn");
const noBtn = document.getElementById("no-btn");

const questionBox = document.getElementById("question-box");
const successBox = document.getElementById("success-box");

const resetBtn = document.getElementById("reset-btn");

const subtext = document.getElementById("subtext");
const emoji = document.getElementById("emoji");

let noCount = 0;

const messages = [
    "Are you sure you miss me? 🥺",
    "Please think again! 💗",
    "Don't break my heart! 💔",
    "You are so Pretty  🥹",
    "I know you miss me 😭"
];

noBtn.addEventListener("click", function() {

    noCount++;

    subtext.textContent =
        messages[Math.min(noCount - 1, messages.length - 1)];

    emoji.textContent = "🥺";

    // Yes button gets bigger
    let size = 1 + noCount * 0.15;
    yesBtn.style.transform = `scale(${Math.min(size, 2)})`;

    // No button moves
    const x = Math.random() * 100 - 50;
    const y = Math.random() * 50 - 25;

    noBtn.style.transform = `translate(${x}px, ${y}px)`;

});

yesBtn.addEventListener("click", function() {

    questionBox.classList.add("hidden");
    successBox.classList.remove("hidden");

    // Floating hearts
    for(let i = 0; i < 25; i++) {
        setTimeout(createHeart, i * 150);
    }

});

resetBtn.addEventListener("click", function() {

    successBox.classList.add("hidden");
    questionBox.classList.remove("hidden");

    noCount = 0;

    yesBtn.style.transform = "scale(1)";
    noBtn.style.transform = "translate(0, 0)";

    subtext.textContent =
        "Be honest... (Try clicking No 😉)";

    emoji.textContent = "🥺";

});

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";
    heart.textContent = ["❤️", "💖", "💕", "💗"][
        Math.floor(Math.random() * 4)
    ];

    heart.style.left = Math.random() * 100 + "vw";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 4000);

}

</script>

</body>
</html>
